name: Deploy Laby Agent to DentNode VPS

on:
  # The existing Cloud Run workflow runs this repository's full test suite.
  # Reusing its successful main-branch SHA gives this deployment provenance
  # while Cloud Run remains available during the VPS migration.
  workflow_run:
    workflows: ["Deploy Laby Agent to Cloud Run"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ai-dentnode-com-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  SERVICE_ID: ai.dentnode.com

jobs:
  build-and-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Resolve tested commit
        id: commit
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid commit SHA" >&2
            exit 1
          }
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      # actions/checkout v4.2.2
      - name: Checkout tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false

      # A manual dispatch does not inherit another workflow's test provenance.
      # Running tests unconditionally also protects against workflow drift.
      # actions/setup-python v5.6.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Verify candidate
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            -r requirements.txt -r requirements-dev.txt
          python -m pytest tests/ -v --tb=short -p no:cacheprovider

      # docker/login-action v3.3.0
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/setup-buildx-action v3.11.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "$image" =~ ^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+$ ]] || {
            echo "Invalid image name" >&2
            exit 1
          }
          echo "name=$image" >> "$GITHUB_OUTPUT"

      # docker/build-push-action v6.18.0
      - name: Build and push tested commit
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.commit.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Prepare pinned SSH client configuration
        id: ssh
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/dentnode-ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/dentnode-ssh/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/dentnode-ssh/known_hosts"

      - name: Deploy immutable digest through restricted dispatcher
        id: deploy
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$SERVICE_ID" == "ai.dentnode.com" ]]
          [[ "$IMAGE_NAME" == "ghcr.io/ramancodians/ai.dentnode.com" ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$VPS_DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$GHCR_ACTOR" =~ ^[A-Za-z0-9_-]+$ ]]
          image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"

          # The short-lived workflow token is consumed from stdin by the
          # server dispatcher for one pull and is never persisted on the VPS.
          printf '%s' "$GHCR_TOKEN" | ssh -i "$RUNNER_TEMP/dentnode-ssh/key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/dentnode-ssh/known_hosts" \
            "$VPS_DEPLOY_USER@$VPS_HOST" \
            "deploy-auth $SERVICE_ID $image_ref $GHCR_ACTOR"

      - name: Read deployment status
        if: ${{ always() && steps.ssh.outcome == 'success' && steps.deploy.outcome != 'skipped' }}
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/dentnode-ssh/key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/dentnode-ssh/known_hosts" \
            "$VPS_DEPLOY_USER@$VPS_HOST" \
            "status $SERVICE_ID"

      - name: Remove ephemeral SSH files
        if: ${{ always() && steps.ssh.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/dentnode-ssh/key" \
            "$RUNNER_TEMP/dentnode-ssh/known_hosts"
