name: Deploy Laby Agent to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-laby-agent-prod
  cancel-in-progress: false

env:
  GCP_PROJECT: app-dentnode-com
  GCP_REGION: asia-south2
  ARTIFACT_REGISTRY: asia-south2-docker.pkg.dev
  ARTIFACT_REPO: dn-dashboard
  CLOUD_RUN_SERVICE: laby-agent

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest tests/ -v --tb=short

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - id: image
        run: |
          SHA="${{ github.sha }}"
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REPO }}/laby-agent:${SHA:0:8}"
          echo "tag=$IMAGE" >> $GITHUB_OUTPUT

      - name: Build and push
        run: |
          docker build -t ${{ steps.image.outputs.tag }} -f Dockerfile .
          docker push ${{ steps.image.outputs.tag }}

      # --no-traffic is not supported when creating a new service (first deploy).
      # Detect this upfront and omit the flag when the service doesn't exist yet.
      - name: Deploy new revision
        id: deploy
        run: |
          SERVICE_EXISTS=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --project=${{ env.GCP_PROJECT }} --region=${{ env.GCP_REGION }} \
            --format="value(name)" 2>/dev/null || true)

          NO_TRAFFIC_FLAG=""
          [ -n "$SERVICE_EXISTS" ] && NO_TRAFFIC_FLAG="--no-traffic --tag=candidate"

          # This is the FULL desired env for the service: --set-env-vars replaces
          # the whole literal-env list, so anything omitted here is deleted from
          # the next revision. Every variable read by agent/config.py and
          # scan_review/config.py belongs in this list, even where the code has a
          # matching default — deploys should not depend on code defaults.
          # PORT is deliberately absent: Cloud Run injects it and rejects it here.
          # ^@^ is gcloud's custom-delimiter form, needed because OPENROUTER_APP_NAME
          # contains a space.
          ENV_VARS="^@^"
          ENV_VARS="${ENV_VARS}LABY_MODEL=deepseek/deepseek-v4-flash"
          ENV_VARS="${ENV_VARS}@LABY_VISION_MODEL=google/gemini-2.5-flash"
          ENV_VARS="${ENV_VARS}@LABY_TURN_TIMEOUT=120"
          ENV_VARS="${ENV_VARS}@LABY_HISTORY_TURNS=12"
          ENV_VARS="${ENV_VARS}@LOG_LEVEL=INFO"
          ENV_VARS="${ENV_VARS}@NODE_INTERNAL_BASE_URL=https://app.dentnode.com/api"
          ENV_VARS="${ENV_VARS}@OPENROUTER_API_BASE=https://openrouter.ai/api/v1"
          ENV_VARS="${ENV_VARS}@OPENROUTER_SITE_URL=https://ai.dentnode.com"
          ENV_VARS="${ENV_VARS}@OPENROUTER_APP_NAME=DentNode Laby"
          # D10.live agent boundary. D10 calls POST /d10/agent/run here, and this
          # service calls D10 back at ${D10_INTERNAL_BASE_URL}/internal/agent/tools/*
          # and /internal/ai/usage-events. D10 mounts those under /api, so the
          # trailing /api is required — without it the requests hit D10's SPA
          # fallback and come back as 200 text/html instead of JSON.
          ENV_VARS="${ENV_VARS}@D10_INTERNAL_BASE_URL=https://d10.live/api"
          ENV_VARS="${ENV_VARS}@D10_AGENT_MODEL=deepseek/deepseek-v4-flash"
          ENV_VARS="${ENV_VARS}@D10_AGENT_TIMEOUT_SECS=120"
          ENV_VARS="${ENV_VARS}@D10_AGENT_MAX_MODEL_CALLS=8"
          # Usage outbox. Cloud Run has no durable local disk, so this is a
          # crash buffer, not storage: the lifespan shutdown hook flushes it on
          # SIGTERM. /tmp is the only path writable by the non-root `laby` user
          # without adding a volume — do NOT use /var/lib here, the container
          # cannot mkdir there and the service will fail to start.
          ENV_VARS="${ENV_VARS}@D10_USAGE_OUTBOX_PATH=/tmp/d10-usage-outbox.sqlite3"
          ENV_VARS="${ENV_VARS}@D10_USAGE_FLUSH_INTERVAL_SECS=10"
          ENV_VARS="${ENV_VARS}@D10_USAGE_BATCH_SIZE=100"
          # Scan Review (standalone mesh QA module).
          ENV_VARS="${ENV_VARS}@SCAN_REVIEW_VISION_MODEL=qwen/qwen3-vl-32b-instruct"
          ENV_VARS="${ENV_VARS}@SCAN_REVIEW_MODEL=qwen/qwen3-vl-32b-instruct"
          ENV_VARS="${ENV_VARS}@SCAN_REVIEW_ENABLE_LLM=true"
          ENV_VARS="${ENV_VARS}@SCAN_REVIEW_LLM_TIMEOUT=90"
          ENV_VARS="${ENV_VARS}@SCAN_REVIEW_MAX_BYTES=83886080"
          ENV_VARS="${ENV_VARS}@SCAN_REVIEW_MAX_FILES=8"
          ENV_VARS="${ENV_VARS}@SCAN_REVIEW_FETCH_TIMEOUT=60"
          ENV_VARS="${ENV_VARS}@SCAN_REVIEW_ANALYZE_TIMEOUT=120"
          ENV_VARS="${ENV_VARS}@SCAN_REVIEW_MAX_FACES=5000000"
          # SSRF control: the module may only dereference URLs on these hosts.
          ENV_VARS="${ENV_VARS}@SCAN_REVIEW_ALLOWED_HOSTS=storage.googleapis.com"
          ENV_VARS="${ENV_VARS}@SCAN_REVIEW_ALLOW_INSECURE_FETCH=false"
          # Audio-to-Text (shared by app.dentnode.com and d10.live).
          ENV_VARS="${ENV_VARS}@AUDIO_TO_TEXT_MODEL=openai/gpt-audio-mini"
          ENV_VARS="${ENV_VARS}@AUDIO_TO_TEXT_TIMEOUT_SECS=120"
          ENV_VARS="${ENV_VARS}@AUDIO_TO_TEXT_MAX_BYTES=26214400"
          ENV_VARS="${ENV_VARS}@AUDIO_TO_TEXT_FETCH_TIMEOUT_SECS=30"
          # SSRF control: the endpoint may only dereference URLs on these hosts.
          ENV_VARS="${ENV_VARS}@AUDIO_TO_TEXT_ALLOWED_HOSTS=.digitaloceanspaces.com,.cdn.digitaloceanspaces.com"
          ENV_VARS="${ENV_VARS}@AUDIO_TO_TEXT_ALLOW_INSECURE_FETCH=false"
          # Text-to-Speech (open to every trusted internal caller). The model is
          # the only one on OpenRouter that emits speech at a sane price — see
          # .env.example. MAX_CHARS is the spend cap on a single call.
          ENV_VARS="${ENV_VARS}@TEXT_TO_SPEECH_MODEL=openai/gpt-audio-mini"
          ENV_VARS="${ENV_VARS}@TEXT_TO_SPEECH_VOICE=alloy"
          ENV_VARS="${ENV_VARS}@TEXT_TO_SPEECH_TIMEOUT_SECS=120"
          ENV_VARS="${ENV_VARS}@TEXT_TO_SPEECH_MAX_CHARS=4000"

          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --project=${{ env.GCP_PROJECT }} --region=${{ env.GCP_REGION }} \
            --image=${{ steps.image.outputs.tag }} \
            --ingress=all \
            --memory=512Mi \
            --set-env-vars="$ENV_VARS" \
            --set-secrets=INTERNAL_API_KEY=LABY_INTERNAL_API_KEY:latest,OPENROUTER_API_KEY=LABY_OPENROUTER_API_KEY:latest,D10_INTERNAL_KEY=LABY_D10_INTERNAL_KEY:latest \
            $NO_TRAFFIC_FLAG --quiet

      - id: revision
        run: |
          REV=$(gcloud run revisions list \
            --service=${{ env.CLOUD_RUN_SERVICE }} --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} --sort-by="~DEPLOYED" --limit=1 \
            --format="value(name)")
          echo "name=$REV" >> $GITHUB_OUTPUT

      # Poll Cloud Run's own revision readiness instead of curling /health —
      # even with --ingress=all, the Readiness=True condition check is highly reliable.
      # check, which is equivalent (and more reliable) than an external curl.
      - name: Wait for revision ready then promote to 100%
        run: |
          REV="${{ steps.revision.outputs.name }}"

          for i in $(seq 1 18); do
            READY=$(gcloud run revisions describe "$REV" \
              --region=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT }} \
              --format=json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((c.get('status','') for c in d.get('status',{}).get('conditions',[]) if c.get('type')=='Ready'), 'Unknown'))" || echo "Unknown")
            echo "Revision ready check $i/18: $READY"
            [ "$READY" = "True" ] && break
            [ "$i" = "18" ] && { echo "Revision did not become Ready in time."; exit 1; }
            sleep 10
          done

          gcloud run services update-traffic ${{ env.CLOUD_RUN_SERVICE }} \
            --project=${{ env.GCP_PROJECT }} --region=${{ env.GCP_REGION }} \
            --to-revisions=$REV=100
          echo "Deployed $REV to 100%."

      - name: Rollback on failure
        if: failure()
        run: |
          STABLE=$(gcloud run revisions list \
            --service=${{ env.CLOUD_RUN_SERVICE }} --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} --sort-by="~DEPLOYED" --limit=2 \
            --format="value(name)" | tail -1)
          [ -n "$STABLE" ] && gcloud run services update-traffic \
            ${{ env.CLOUD_RUN_SERVICE }} --project=${{ env.GCP_PROJECT }} \
            --region=${{ env.GCP_REGION }} --to-revisions=${STABLE}=100
          exit 1
